name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Content checks
        run: |
          npm run check:signs
          npm run check:content

      - name: Secret and personal-data scan
        run: npm run check:secrets

      # Optional repository variable (Settings -> Secrets and variables -> Actions
      # -> Variables). Set CUSTOM_DOMAIN (e.g. guiab.es) to serve from the domain
      # root; leave it unset to keep the project-site URL under /<repository>/.
      # A shell step is used because `cond && '' || 'x'` yields 'x' in expressions.
      - name: Resolve site URL and base path
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        shell: bash
        run: |
          # [[ =~ ]] matches the whole value, so a newline cannot smuggle extra
          # lines into $GITHUB_ENV the way line-based grep allowed.
          if [ -n "$CUSTOM_DOMAIN" ]; then
            if ! [[ "$CUSTOM_DOMAIN" =~ ^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$ ]]; then
              echo "::error::CUSTOM_DOMAIN must be a bare hostname such as guiab.es"
              exit 1
            fi
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            # GitHub Pages project site: the site lives under /<repository>/
            echo "NEXT_PUBLIC_BASE_PATH=/guia-licencia-web" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://alebc96.github.io" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        run: npm run build

      # A failed deployment can leave the Pages site disabled; enablement lets the
      # workflow turn it back on instead of failing with a 404 from the API.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

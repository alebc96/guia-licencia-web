services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: guia-licencia-web:local
    container_name: guia-licencia-web
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

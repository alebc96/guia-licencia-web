server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Security headers that make sense for a static, account-less site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Static export uses trailing slashes: every route is a directory.
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # Fingerprinted Next.js assets never change.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pagefind index and generated media change with every build.
    location /pagefind/ {
        expires 1h;
        try_files $uri =404;
    }

    location /senales/ {
        expires 30d;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
